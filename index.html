<style>
:root{ --gold:#d8b36a; --gold-dim:rgba(216,179,106,.35); }
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#000;overflow:hidden}
body{font-family:'Noto Serif TC',serif;color:#e9e6de;user-select:none;touch-action:manipulation}
button{font-family:'Noto Sans TC',sans-serif;cursor:pointer}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 10%,#141a26 0%,#07090f 70%);overflow:hidden}
#stage.shake{animation:shk .55s ease}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-10px,4px)}30%{transform:translate(9px,-5px)}45%{transform:translate(-7px,3px)}60%{transform:translate(6px,-3px)}75%{transform:translate(-4px,2px)}90%{transform:translate(3px,-1px)}}
.bgLayer{position:absolute;inset:-3%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.1s ease}
.bgLayer.on{opacity:1;animation:kenb 30s ease-in-out infinite alternate}
@keyframes kenb{from{transform:scale(1)}to{transform:scale(1.06) translate(-.5%,-.3%)}}
@media (prefers-reduced-motion: reduce){.bgLayer.on{animation:none}}
#stage.sepia .bgLayer{filter:sepia(.38) brightness(.94) contrast(1.02)}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 95% at 50% 45%,transparent 55%,rgba(0,0,0,.42) 100%)}
#spriteLayer{position:absolute;inset:0;pointer-events:none;z-index:3}
img.sprite{position:absolute;bottom:-2.5%;height:90%;width:auto;transform:translateX(-50%) translateY(14px);opacity:0;transition:opacity .32s ease,transform .32s ease,filter .28s ease;filter:drop-shadow(0 10px 20px rgba(0,0,0,.45));will-change:opacity,transform}
img.sprite.on{opacity:1;transform:translateX(-50%) translateY(0)}
img.sprite.dim{opacity:.45;filter:brightness(.7) saturate(.85) drop-shadow(0 10px 20px rgba(0,0,0,.45))}
img.sprite.pos-l{left:24%}img.sprite.pos-c{left:50%}img.sprite.pos-r{left:76%}
img.sprite.multiply{mix-blend-mode:multiply}
#fxDark{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1s ease;pointer-events:none;z-index:4}
#cardLayer{position:absolute;inset:0;pointer-events:none;z-index:5;display:flex;justify-content:center;align-items:flex-start}
#postcard{position:relative;margin-top:5.5vh;width:min(46vw,420px);background:#f3ecdd;padding:10px 10px 12px;transform:rotate(-2.6deg) translateY(-14px);box-shadow:0 18px 50px rgba(0,0,0,.65);opacity:0;transition:opacity .7s ease,transform .7s ease;border:1px solid #d9cfb8}
#postcard.on{opacity:1;transform:rotate(-2.6deg) translateY(0)}
#postcard img{width:100%;display:block}
.pc-stamp{position:absolute;top:16px;right:16px;width:44px;height:52px;border:2px dashed #a3452f;color:#a3452f;font-family:'Noto Sans TC';font-size:9px;display:flex;align-items:center;justify-content:center;transform:rotate(6deg);background:rgba(255,255,255,.75);letter-spacing:.08em}
#pcCap{margin-top:8px;text-align:center;color:#5c5138;font-size:clamp(10px,1.5vh,13px);letter-spacing:.28em;font-family:'Noto Sans TC'}
#cgLayer{position:absolute;inset:0;background:rgba(0,0,0,.94);z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;opacity:0;pointer-events:none;transition:opacity .5s ease}
#cgLayer.on{opacity:1;pointer-events:auto}
#cgLayer img{max-width:92%;max-height:82%;border:6px solid #f3ecdd}
.cgHint{margin-top:14px;color:var(--gold);font-size:12px;letter-spacing:.3em;font-family:'Noto Sans TC';animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:.9}}
#chapterCard{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(90% 90% at 50% 50%,rgba(10,12,20,.92),rgba(0,0,0,.97));opacity:0;transition:opacity .45s ease}
#chapterCard.show{opacity:1}
#chNum{color:var(--gold);font-size:clamp(13px,2.4vh,18px);letter-spacing:.6em;font-family:'Noto Sans TC'}
#chTitle{color:#efe9da;font-size:clamp(26px,6vh,52px);letter-spacing:.3em;font-weight:600;text-shadow:0 0 30px rgba(216,179,106,.25)}
.chLine{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
#choiceLayer{position:absolute;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.5);backdrop-filter:blur(2px)}
#choicePrompt{font-size:clamp(14px,2.5vh,20px);color:#f0ead9;margin-bottom:12px;letter-spacing:.12em}
.choiceBtn{width:min(82%,580px);background:rgba(16,18,28,.88);border:1px solid var(--gold-dim);color:#e9e2cf;padding:14px 22px;font-size:clamp(13px,2.1vh,17px);border-radius:8px;transition:.2s;letter-spacing:.06em;font-family:'Noto Serif TC'}
.choiceBtn:hover{background:rgba(216,179,106,.16);border-color:var(--gold);transform:translateY(-2px)}
#chatLayer{position:absolute;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:rgba(4,6,10,.62)}
#chatBox{width:min(92%,620px);height:min(66vh,560px);background:#101319;border:1px solid rgba(255,255,255,.14);border-radius:14px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.7)}
#chatHead{padding:12px 18px;background:#181c26;border-bottom:1px solid rgba(255,255,255,.08);font-family:'Noto Sans TC';font-size:14px;color:#cfd3e0;letter-spacing:.1em}
#chatBody{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.bubble{max-width:78%;padding:10px 14px;border-radius:12px;font-size:clamp(13px,2vh,16px);line-height:1.7;animation:pop .25s ease;font-family:'Noto Sans TC'}
.bubble .bw{display:block;font-size:10px;opacity:.55;margin-bottom:3px;letter-spacing:.15em}
.bubble.him{align-self:flex-start;background:#232a38;color:#dfe4ee;border-bottom-left-radius:4px}
.bubble.me{align-self:flex-end;background:#3d5a43;color:#eef4ea;border-bottom-right-radius:4px}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
#chatHint{padding:10px;text-align:center;font-size:11px;color:var(--gold);letter-spacing:.25em;font-family:'Noto Sans TC';animation:blink 1.4s infinite}
#textBox{position:absolute;left:50%;bottom:2.4vh;transform:translateX(-50%);width:min(94%,1080px);min-height:clamp(118px,21vh,200px);background:linear-gradient(180deg,rgba(14,16,26,.9),rgba(8,9,16,.94));border:1px solid rgba(216,179,106,.28);border-radius:10px;padding:clamp(16px,2.6vh,28px) clamp(18px,3vw,42px);box-shadow:0 12px 44px rgba(0,0,0,.55);z-index:10;display:none}
#textBox::before{content:'';position:absolute;top:0;left:26px;right:26px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
#namePlate{position:absolute;top:-17px;left:26px;background:linear-gradient(135deg,#6b5327,#d8b36a);color:#171106;font-weight:700;padding:4px 22px;border-radius:4px;font-family:'Noto Sans TC';letter-spacing:.18em;font-size:clamp(12px,1.9vh,15px);box-shadow:0 4px 14px rgba(0,0,0,.5);display:none}
#textArea{font-size:clamp(15px,2.35vh,20px);line-height:2;letter-spacing:.05em;min-height:4em;color:#e9e6de;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#textArea.narr{color:#c9cfdd}
#textArea.inner{color:#a9b0c8}
#textArea.quote{color:#e8d9b0}
#contArrow{position:absolute;right:20px;bottom:10px;color:var(--gold);font-size:14px;opacity:0;animation:bob 1s infinite}
#contArrow.on{opacity:1}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
#hud{position:absolute;top:14px;right:16px;display:flex;gap:8px;z-index:20}
.hbtn{background:rgba(15,17,26,.62);border:1px solid rgba(255,255,255,.18);color:#cfd3e0;padding:6px 13px;border-radius:999px;font-size:12px;transition:.2s;letter-spacing:.08em}
.hbtn:hover{border-color:var(--gold);color:var(--gold)}
.hbtn.active{background:rgba(216,179,106,.22);border-color:var(--gold);color:#f0dfb6}
#musicNote{position:absolute;left:16px;bottom:12px;font-size:11px;color:rgba(216,179,106,.75);letter-spacing:.15em;font-family:'Noto Sans TC';z-index:11;pointer-events:none}
#settings{position:absolute;top:52px;right:16px;z-index:25;background:rgba(12,14,22,.94);border:1px solid rgba(216,179,106,.3);border-radius:10px;padding:16px 18px;display:none;flex-direction:column;gap:12px;font-family:'Noto Sans TC';font-size:13px;color:#d8d4c8}
#settings label{display:flex;align-items:center;gap:10px}
#settings input[type=range]{width:150px;accent-color:var(--gold)}
#logPanel{position:absolute;top:0;right:0;bottom:0;width:min(430px,92%);background:rgba(10,12,18,.97);border-left:1px solid rgba(216,179,106,.3);z-index:25;transform:translateX(105%);transition:transform .3s ease;display:flex;flex-direction:column}
#logPanel.on{transform:translateX(0)}
#logHead{padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;justify-content:space-between;align-items:center;font-family:'Noto Sans TC';letter-spacing:.2em;color:var(--gold)}
#logClose{background:none;border:1px solid rgba(255,255,255,.25);color:#ccc;border-radius:6px;padding:2px 10px}
#logBody{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px;font-size:13.5px;line-height:1.8}
.logName{font-family:'Noto Sans TC';font-weight:700;margin-right:8px}
#titleScreen{position:absolute;inset:0;z-index:40;background-color:#0a0d15;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;transition:opacity 1s ease}
#titleScreen::before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,12,.55) 0%,rgba(5,7,12,.25) 45%,rgba(5,7,12,.88) 100%)}
#titleScreen.gone{opacity:0;pointer-events:none}
.ts-inner{position:relative;text-align:center;padding:20px;animation:fadeUp 1.4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
.ts-tag{font-family:'Noto Sans TC';color:var(--gold);letter-spacing:.55em;font-size:clamp(10px,1.7vh,13px);margin-bottom:14px}
.ts-inner h1{font-size:clamp(40px,9.5vh,84px);letter-spacing:.22em;font-weight:700;color:#f2ecdc;text-shadow:0 4px 30px rgba(0,0,0,.8),0 0 60px rgba(216,179,106,.2);margin-bottom:16px}
.ts-sub{font-size:clamp(12px,2.2vh,17px);color:#cfc8b6;letter-spacing:.14em;margin-bottom:40px}
.ts-btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.ts-btns button{background:rgba(14,16,24,.75);border:1px solid var(--gold-dim);color:#efe6cd;padding:12px 34px;font-size:clamp(14px,2.3vh,18px);letter-spacing:.3em;border-radius:6px;transition:.25s}
.ts-btns button:hover{border-color:var(--gold);background:rgba(216,179,106,.18)}
.ts-note{margin-top:34px;font-size:clamp(10px,1.6vh,12px);color:rgba(230,225,210,.55);letter-spacing:.12em;line-height:2;font-family:'Noto Sans TC'}
.ts-hint{margin-top:10px;font-size:11px;color:rgba(216,179,106,.8);letter-spacing:.2em;font-family:'Noto Sans TC';animation:blink 1.6s infinite}
#gallery{position:absolute;inset:0;z-index:42;background:rgba(5,7,12,.97);display:none;flex-direction:column}
#galHead{padding:18px 22px;border-bottom:1px solid rgba(216,179,106,.25);display:flex;justify-content:space-between;align-items:center;font-family:'Noto Sans TC';letter-spacing:.25em;color:var(--gold)}
#galGrid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px;padding:20px}
.galItem{background:#12151f;border:1px solid rgba(255,255,255,.12);border-radius:8px;overflow:hidden;cursor:pointer;transition:.2s}
.galItem:hover{border-color:var(--gold)}
.galItem img{width:100%;height:130px;object-fit:cover;display:block}
.galLock{width:100%;height:130px;display:flex;align-items:center;justify-content:center;background:#0a0c12;color:#4a4f60;font-size:22px;letter-spacing:.3em}
.galName{padding:8px 10px;font-size:12px;font-family:'Noto Sans TC';letter-spacing:.1em;color:#d8d4c8;text-align:center}
.galItem.locked{opacity:.55;cursor:default}
#galView{position:absolute;inset:0;z-index:43;background:rgba(0,0,0,.93);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px}
#galView img{max-width:90%;max-height:78%;border:5px solid #f3ecdd}
#galViewCap{color:var(--gold);letter-spacing:.2em;font-family:'Noto Sans TC';font-size:13px}
#endScreen{position:absolute;inset:0;z-index:41;background:#04050a;display:none;align-items:center;justify-content:center;overflow:hidden}
.es-inner{max-width:min(88%,760px);text-align:center;padding:20px}
.endline{opacity:0;font-size:clamp(14px,2.5vh,20px);line-height:2.1;letter-spacing:.08em;color:#cfd0da;animation:eline 1.4s ease forwards}
@keyframes eline{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.es-end{opacity:0;margin-top:34px;font-size:clamp(26px,5.4vh,44px);letter-spacing:.4em;color:var(--gold);font-weight:700;animation:eline 2s ease forwards}
.es-note{opacity:0;margin-top:26px;font-size:clamp(11px,1.8vh,14px);color:rgba(210,205,190,.6);line-height:2.1;letter-spacing:.06em;animation:eline 2s ease forwards;font-family:'Noto Sans TC'}
.es-btns{opacity:0;margin-top:30px;display:flex;gap:14px;justify-content:center;animation:eline 2s ease forwards}
.es-btns button{background:rgba(14,16,24,.8);border:1px solid var(--gold-dim);color:#efe6cd;padding:10px 30px;letter-spacing:.25em;border-radius:6px}
.es-btns button:hover{border-color:var(--gold)}
#loading{position:absolute;inset:0;z-index:50;background:#07090f;display:flex;align-items:center;justify-content:center;transition:opacity .7s ease}
#loading.off{opacity:0;pointer-events:none}
.ld-inner{text-align:center;width:min(80%,420px)}
.ld-title{font-size:clamp(22px,4.5vh,34px);letter-spacing:.4em;color:#e9e2cf;margin-bottom:8px}
.ld-sub{font-size:11px;color:rgba(216,179,106,.7);letter-spacing:.3em;margin-bottom:26px;font-family:'Noto Sans TC'}
.ld-bar{height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
#ldFill{height:100%;width:0;background:linear-gradient(90deg,#8a6a2f,var(--gold));transition:width .3s ease}
#ldText{margin-top:14px;font-size:11px;color:#8b8fa0;letter-spacing:.2em;font-family:'Noto Sans TC'}
#ldSkip{margin-top:18px;display:none;background:none;border:1px solid rgba(216,179,106,.5);color:var(--gold);padding:8px 26px;border-radius:6px;letter-spacing:.2em;font-size:12px}

 img.sprite{height:62%}
 img.sprite.pos-l{left:27%}img.sprite.pos-r{left:73%}
 #postcard{width:62vw}
 #hud .hbtn{padding:5px 9px;font-size:11px}
}
</style>

<body>
<div id="stage">
  <div class="bgLayer" id="bgA"></div>
  <div class="bgLayer" id="bgB"></div>
  <div id="vignette"></div>
  <div id="spriteLayer"></div>
  <div id="fxDark"></div>
  <div id="cardLayer"><div id="postcard"><div class="pc-stamp">AIR MAIL</div><img id="pcImg" alt="postcard"><div id="pcCap">CAMBODIA ・ 高棉的微笑</div></div></div>
  <div id="cgLayer"><img id="cgImg" alt="cg"><div class="cgHint">點 擊 繼 續</div></div>
  <div id="chapterCard"><div id="chNum"></div><div class="chLine"></div><div id="chTitle"></div></div>
  <div id="choiceLayer" data-ui><div id="choicePrompt"></div><div id="choiceBtns" style="display:flex;flex-direction:column;gap:14px;align-items:center"></div></div>
  <div id="chatLayer" data-ui><div id="chatBox"><div id="chatHead">訊息 ・ 陳志偉</div><div id="chatBody"></div><div id="chatHint">點擊顯示訊息 ▼</div></div></div>
  <div id="textBox"><div id="namePlate"></div><div id="textArea"></div><div id="contArrow">▼</div></div>
  <div id="hud" data-ui>
    <button class="hbtn" id="btnAuto">自動</button>
    <button class="hbtn" id="btnSkip">快進</button>
    <button class="hbtn" id="btnLog">記錄</button>
    <button class="hbtn" id="btnSet">♪ 設定</button>
    <button class="hbtn" id="btnTitle">標題</button>
  </div>
  <div id="settings" data-ui>
    <label>主音量 <input type="range" id="volRange" min="0" max="100" value="80"></label>
    <label><input type="checkbox" id="chkMusic" checked> 背景配樂</label>
    <label><input type="checkbox" id="chkSfx" checked> 音效</label>
  </div>
  <div id="logPanel" data-ui><div id="logHead">劇 情 記 錄 <button id="logClose">✕</button></div><div id="logBody"></div></div>
  <div id="musicNote"></div>
  <div id="titleScreen" data-ui>
    <div class="ts-inner">
      <div class="ts-tag">視覺小說 ・ VISUAL NOVEL</div>
      <h1>消失的父親節</h1>
      <div class="ts-sub">—— 那張明信片上的微笑，嘴角似乎是往下垂的。</div>
      <div class="ts-btns"><button id="btnStart">開始遊戲</button><button id="btnContinue" style="display:none">繼續遊戲</button><button id="btnGallery">CG 鑑賞</button></div>
      <div class="ts-note">改編自同名短篇小說｜建議開啟聲音遊玩<br>本作涉及家暴、婚外情與人口販運暗示等嚴肅議題</div>
      <div class="ts-hint">（ 點 擊 任 意 處 開 啟 配 樂 ）</div>
    </div>
  </div>
  <div id="gallery" data-ui><div id="galHead">CG 鑑 賞 <button id="galClose">✕</button></div><div id="galGrid"></div></div>
  <div id="galView" data-ui><img id="galViewImg" alt=""><div id="galViewCap"></div></div>
  <div id="endScreen" data-ui></div>
  <div id="loading"><div class="ld-inner"><div class="ld-title">消失的父親節</div><div class="ld-sub">LOADING ・ 立繪去背與場景載入中</div><div class="ld-bar"><div id="ldFill"></div></div><div id="ldText">載入資源中… 0%</div><button id="ldSkip">跳過載入直接進入</button></div></div>
</div>

let ctx=null,master=null,musicBus=null,sfxBus=null,delaySend=null,playing=null,musicOn=true,sfxOn=true,musicStarted=false;
function initAudio(){
 try{
  if(ctx){if(ctx.state==='suspended')ctx.resume();return;}
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  ctx=new AC();
  master=ctx.createGain();master.gain.value=(+(store.get('vd_vol'))||80)/100;master.connect(ctx.destination);
  musicBus=ctx.createGain();musicBus.gain.value=musicOn?1:0;musicBus.connect(master);
  sfxBus=ctx.createGain();sfxBus.connect(master);
  const dl=ctx.createDelay(1);dl.delayTime.value=.38;
  const fb=ctx.createGain();fb.gain.value=.32;
  const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=2400;
  dl.connect(fb);fb.connect(fl);fl.connect(dl);dl.connect(musicBus);
  delaySend=ctx.createGain();delaySend.gain.value=.5;delaySend.connect(dl);
 }catch(e){}
}
function piano(t,f,d,v,dest){
 try{
  const o1=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain(),flt=ctx.createBiquadFilter();
  o1.type='triangle';o1.frequency.value=f;o2.type='sine';o2.frequency.value=f*2;g2.gain.value=.35;
  flt.type='lowpass';flt.frequency.value=Math.min(f*6,4500);
  o1.connect(g);o2.connect(g2);g2.connect(g);g.connect(flt);flt.connect(dest);
  const s=ctx.createGain();s.gain.value=.18*v;g.connect(s);s.connect(delaySend);
  const vv=v*.5;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vv,t+.008);
  g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(d,.3)*1.15+.4);
  o1.start(t);o2.start(t);o1.stop(t+d+1.6);o2.stop(t+d+1.6);
 }catch(e){}
}
function pad(t,f,d,v,dest){
 try{
  [f*.998,f*1.004].forEach(ff=>{
   const o=ctx.createOscillator(),flt=ctx.createBiquadFilter(),g=ctx.createGain();
   o.type='sawtooth';o.frequency.value=ff;flt.type='lowpass';flt.frequency.value=700;flt.Q.value=.6;
   o.connect(flt);flt.connect(g);g.connect(dest);
   const vv=v*.16;
   g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vv,t+Math.min(.6,d*.3));
   g.gain.setValueAtTime(vv,t+d*.6);g.gain.linearRampToValueAtTime(0,t+d);
   o.start(t);o.stop(t+d+.1);
  });
 }catch(e){}
}
function bassN(t,f,d,v,dest){
 try{
  const o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),g2=ctx.createGain();
  o.type='sine';o.frequency.value=f;o2.type='triangle';o2.frequency.value=f;g2.gain.value=.4;
  o.connect(g);o2.connect(g2);g2.connect(g);g.connect(dest);
  const vv=v*.5;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vv,t+.03);
  g.gain.setTargetAtTime(.0001,t+d*.7,.25);
  o.start(t);o2.start(t);o.stop(t+d+1);o2.stop(t+d+1);
 }catch(e){}
}
function playVoice(e,when,dest){
 const f=440*Math.pow(2,(e.m-69)/12);
 if(e.i==='piano')piano(when,f,e.d,e.v,dest);
 else if(e.i==='pad')pad(when,f,e.d,e.v,dest);
 else bassN(when,f,e.d,e.v,dest);
}

const TRACKS={title:mkTitle,daily:mkDaily,memory:mkMemory,hope:mkHope,tension:mkTension,ending:mkEnding};
function playMusic(name){
 try{
  if(!ctx||!TRACKS[name])return;
  if(playing){const old=playing;playing=null;clearInterval(old.timer);old.gain.gain.setTargetAtTime(0,ctx.currentTime,.5);setTimeout(()=>{try{old.gain.disconnect();}catch(e){}},3000);}
  const track=TRACKS[name]();
  const gain=ctx.createGain();gain.gain.value=0;gain.connect(musicBus);
  gain.gain.setTargetAtTime(.9,ctx.currentTime,.6);
  const st={track,gain,i:0,loopBase:ctx.currentTime+.15,spb:60/track.bpm,timer:null};
  playing=st;
  const sched=()=>{
   try{
    const ahead=ctx.currentTime+.6;let guard=0;
    while(guard++<600){
     const e=st.track.ev[st.i];const tAbs=st.loopBase+e.b*st.spb;
     if(tAbs>ahead)break;
     playVoice(e,Math.max(tAbs,ctx.currentTime+.02),st.gain);
     st.i++;
     if(st.i>=st.track.ev.length){st.i=0;st.loopBase+=st.track.loop*st.spb;}
    }
   }catch(e){}
  };
  st.timer=setInterval(sched,140);sched();
  $('musicNote').textContent='♪ '+MUSIC_NAMES[name];
 }catch(e){}
}
function sfx(k){
 try{
  if(!ctx||!sfxOn)return;
  const t=ctx.currentTime;
  const mk=(f,d,v,type,slide)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+d+.05);};
  if(k==='bell'){mk(1244,.6,.12);mk(1866,.9,.06);}
  else if(k==='select'){mk(784,.12,.1,'triangle');setTimeout(()=>mk(1175,.2,.1,'triangle'),90);}
  else if(k==='send'){mk(1318,.09,.1);setTimeout(()=>mk(1760,.12,.09),70);}
  else if(k==='recv'){mk(987,.1,.1);setTimeout(()=>mk(784,.14,.09),80);}
  else if(k==='chime'){mk(784,.5,.08,'triangle');setTimeout(()=>mk(1175,.8,.07,'triangle'),160);}
  else if(k==='hit'){mk(90,.4,.3,'sine',45);}
 }catch(e){}
}

/* ---- 立繪管理：同角色表情直接切換、同位置互斥，避免疊影 ---- */
function killSprite(id){
 const el=spriteEls[id];
 if(!el)return;
 if(spriteTimers[id]){clearTimeout(spriteTimers[id]);delete spriteTimers[id];}
 el.remove();
 delete spriteEls[id];
}
function showSprite(id,pos,instant){
 const proc=SPRPROC[id];
 if(proc===undefined)return;
 const grp=CHAR_OF[id];
 Object.keys(spriteEls).forEach(other=>{
  if(other===id)return;
  const el=spriteEls[other];
  if(!el)return;
  const sameGrp=grp&&CHAR_OF[other]===grp;
  const samePos=el.classList.contains('pos-'+pos);
  if(sameGrp||samePos)killSprite(other);
 });
 let el=spriteEls[id];
 if(!el){
  el=document.createElement('img');
  el.className='sprite';el.alt='';el.decoding='async';
  if(proc===null){el.src=IMGS[id];el.classList.add('multiply');}
  else el.src=proc;
  el.onerror=()=>{if(spriteEls[id]===el)killSprite(id);};
  spriteEls[id]=el;
  $('spriteLayer').appendChild(el);
 }else if(spriteTimers[id]){
  clearTimeout(spriteTimers[id]);delete spriteTimers[id];
 }
 el.classList.remove('pos-l','pos-c','pos-r');
 el.classList.add('pos-'+pos);
 if(instant){el.style.transition='none';el.classList.add('on');void el.offsetWidth;el.style.transition='';}
 else requestAnimationFrame(()=>el.classList.add('on'));
}
function hideSprite(id,instant){
 const el=spriteEls[id];if(!el)return;
 if(instant){killSprite(id);return;}
 if(spriteTimers[id])clearTimeout(spriteTimers[id]);
 el.classList.remove('on');
 spriteTimers[id]=setTimeout(()=>{
  delete spriteTimers[id];
  if(spriteEls[id]===el&&!el.classList.contains('on')){el.remove();delete spriteEls[id];}
 },380);
}

/* ---- 流程 ---- */
function pump(){
 try{
  let ev;
  if(queue.length)ev=queue.shift();
  else{saveGame(idx);ev=SCRIPT[idx++];}
  if(!ev)return;
  switch(ev.t){
   case 'bg':setBg(ev.id);pump();break;
   case 'bgm':playMusic(ev.id);pump();break;
   case 'show':showSprite(ev.id,ev.pos);pump();break;
   case 'hide':hideSprite(ev.id);pump();break;
   case 'card':setCard(ev.on,ev.img,ev.cap);pump();break;
   case 'fx':doFx(ev.k);pump();break;
   case 'sfx':sfx(ev.k);pump();break;
   case 'chapter':showChapter(ev);break;
   case 'text':runText(ev);break;
   case 'choice':showChoice(ev);break;
   case 'chat':openChat(ev.msgs);break;
   case 'cg':showCG(ev.id);break;
   case 'end':showEnd();break;
   default:pump();
  }
 }catch(err){
  if(queue.length===0)idx++;
  setTimeout(pump,60);
 }
}
function advance(){
 if(mode==='text'){if(typing)completeText();else if(awaiting){clearTimeout(autoTimer);awaiting=false;pump();}}
 else if(mode==='chapter')closeChapter();
 else if(mode==='cg')closeCG();
 else if(mode==='chat')chatClick();
}
function showChapter(ev){
 mode='chapter';
 $('chNum').textContent=ev.n;$('chTitle').textContent=ev.s;
 const c=$('chapterCard');c.style.display='flex';c.classList.remove('show');void c.offsetWidth;c.classList.add('show');

 if(mode!=='chapter')return;
 clearTimeout(chTimer);mode='wait';
 $('chapterCard').classList.remove('show');
 setTimeout(()=>{$('chapterCard').style.display='none';pump();},460);
}
function showChoice(ev){
 mode='choice';
 $('choicePrompt').textContent=ev.prompt||'——';
 const box=$('choiceBtns');box.innerHTML='';
 ev.opts.forEach(o=>{
  const b=document.createElement('button');b.className='choiceBtn';b.textContent=o.t;
  b.onclick=()=>{b.blur();sfx('select');$('choiceLayer').style.display='none';if(o.br&&o.br.length)queue.push.apply(queue,o.br);pump();};
  box.appendChild(b);
 });

function openChat(msgs){
 mode='chat';chatMsgs=msgs;chatShown=0;
 $('chatBody').innerHTML='';$('chatLayer').style.display='flex';
 $('chatHint').textContent='點擊顯示訊息 ▼';
 if(skipOn){while(chatShown<msgs.length)addBubble();$('chatHint').textContent='點擊繼續 ▼';}
}
function addBubble(){
 const m=chatMsgs[chatShown++];
 const d=document.createElement('div');
 d.className='bubble '+(m.w==='淑芬'?'me':'him');
 const s=document.createElement('span');s.className='bw';s.textContent=m.w;
 d.appendChild(s);d.appendChild(document.createTextNode(m.t));
 $('chatBody').appendChild(d);$('chatBody').scrollTop=$('chatBody').scrollHeight;
 sfx(m.w==='淑芬'?'send':'recv');
}
function chatClick(){
 if(chatShown<chatMsgs.length){addBubble();if(chatShown>=chatMsgs.length)$('chatHint').textContent='點擊繼續 ▼';}
 else{$('chatLayer').style.display='none';pump();}
}
function showCG(id){
 mode='cg';
 $('cgImg').src=IMGS[id]||IMGS.bayon;
 unlockCG(id);
 $('cgLayer').classList.add('on');
}
function closeCG(){if(mode!=='cg')return;$('cgLayer').classList.remove('on');mode='wait';setTimeout(pump,300);}
/* ---- CG 鑑賞 ---- */
function buildGallery(){
 const grid=$('galGrid');grid.innerHTML='';
 let un=[];try{un=JSON.parse(store.get('vd_cgs')||'[]');}catch(e){}
 CG_LIST.forEach(c=>{
  const d=document.createElement('div');
  const ok=un.indexOf(c.id)>=0;
  d.className='galItem'+(ok?'':' locked');
  if(ok){
   const im=document.createElement('img');im.src=IMGS[c.id];im.alt=c.name;im.loading='lazy';
   d.appendChild(im);
   d.onclick=()=>{$('galViewImg').src=IMGS[c.id];$('galViewCap').textContent=c.name;$('galView').style.display='flex';};
  }else{
   const lk=document.createElement('div');lk.className='galLock';lk.textContent='？？？';
   d.appendChild(lk);
  }
  const nm=document.createElement('div');nm.className='galName';nm.textContent=ok?c.name:'未解鎖';
  d.appendChild(nm);
  grid.appendChild(d);
 });
}

function showEnd(){
 mode='end';
 $('textBox').style.display='none';

 const note=document.createElement('div');note.className='es-note';note.innerHTML='父親的「出國做生意」、對目的地諱莫如深、金邊的「天哥」、西港的「新工作」……<br>小說以懸念收尾，指向那些年被困在海外詐騙園區、回不來的人們。<br>「明年應該不用再過父親節了」——淑芬這句話，是解脫，或許也是最殘酷的預言。';note.style.animationDelay=d+'s';wrap.appendChild(note);d+=2;

 const b2=document.createElement('button');b2.textContent='回到標題';b2.onclick=()=>{b2.blur();es.style.display='none';toTitle();};

/* ---- 開始 / 讀檔 ---- */
function resetVisual(){
 Object.keys(spriteEls).forEach(killSprite);
 $('spriteLayer').innerHTML='';
 bgFront.classList.remove('on');bgBack.classList.remove('on');
 stage.classList.remove('sepia');
 $('fxDark').style.opacity=0;
 setCard(false);$('cgLayer').classList.remove('on');$('choiceLayer').style.display='none';$('chatLayer').style.display='none';
 $('chapterCard').style.display='none';$('logBody').innerHTML='';
 $('textArea').textContent='';$('namePlate').style.display='none';$('contArrow').classList.remove('on');
 clearInterval(typeTimer);clearTimeout(autoTimer);typing=false;awaiting=false;
}
function startNew(){
 idx=0;queue=[];flags={};
 resetVisual();
 $('textBox').style.display='block';
 mode='wait';
 pump();
}
function resume(){
 let s=null;try{s=JSON.parse(store.get(SAVEKEY)||'null');}catch(e){}
 if(!s){startNew();return;}
 flags=s.flags||{};idx=s.i||0;queue=[];
 resetVisual();
 let lastBgm=null;
 for(let k=0;k<idx;k++){
  const ev=SCRIPT[k];if(!ev)break;
  switch(ev.t){
   case 'bg':setBg(ev.id,true);break;
   case 'show':showSprite(ev.id,ev.pos,true);break;
   case 'hide':hideSprite(ev.id,true);break;
   case 'card':setCard(ev.on,ev.img,ev.cap);break;
   case 'fx':doFx(ev.k);break;
   case 'bgm':lastBgm=ev.id;break;
  }
 }
 if(lastBgm)playMusic(lastBgm);
 $('textBox').style.display='block';
 mode='wait';
 pump();
}
function toTitle(){
 resetVisual();
 mode='title';
 if(store.get(SAVEKEY))$('btnContinue').style.display='';
 $('titleScreen').classList.remove('gone');
}
/* ---- 輸入 ---- */
stage.addEventListener('click',e=>{

$('volRange').oninput=e=>{store.set('vd_vol',e.target.value);if(ctx&&master)master.gain.setTargetAtTime(e.target.value/100,ctx.currentTime,.1);};

$('btnContinue').onclick=e=>{e.stopPropagation();initAudio();musicStarted=true;$('titleScreen').classList.add('gone');resume();};
/* ---- 立繪去背 & 預載 ---- */
function keyOut(img){
 try{
  const w=img.naturalWidth,h=img.naturalHeight;
  const MAX=1300,sc=Math.min(1,MAX/Math.max(w,h));
  const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
  const c=document.createElement('canvas');c.width=cw;c.height=ch;
  const x=c.getContext('2d',{willReadFrequently:true});
  x.drawImage(img,0,0,cw,ch);
  const d=x.getImageData(0,0,cw,ch);
  const p=d.data;
  for(let i=0;i<p.length;i+=4){
   const r=p[i],g=p[i+1],b=p[i+2];
   const mn=r<g?(r<b?r:b):(g<b?g:b);
   const mx=r>g?(r>b?r:b):(g>b?g:b);
   if(mn>232&&mx-mn<28)p[i+3]=0;
   else if(mn>198&&mx-mn<30)p[i+3]=(p[i+3]*(232-mn)/34)|0;
  }
  x.putImageData(d,0,0);
  return c.toDataURL('image/png');
 }catch(e){return null;}
}
function loadImg(url,cross,timeout){
 return new Promise(res=>{
  const im=new Image();
  if(cross)im.crossOrigin='anonymous';
  im.decoding='async';
  const to=setTimeout(()=>{im.onload=null;im.onerror=null;im.src='';res(null);},timeout||12000);
  im.onload=()=>{clearTimeout(to);res(im);};
  im.onerror=()=>{clearTimeout(to);res(null);};
  im.src=url;
 });
}
let booted=false;
function boot(){
 if(booted)return;booted=true;
 $('loading').classList.add('off');
 if(store.get(SAVEKEY))$('btnContinue').style.display='';
}
async function preloadAll(){
 const bgKeys=Object.keys(IMGS).filter(k=>SPRITE_IDS.indexOf(k)<0);
 const total=bgKeys.length+SPRITE_IDS.length;let done=0;
 const upd=()=>{const pc=Math.min(100,Math.round(100*done/total));$('ldFill').style.width=pc+'%';$('ldText').textContent='載入資源中… '+pc+'%';};
 const tasks=[];
 for(const k of bgKeys)tasks.push(loadImg(IMGS[k],false,12000).then(()=>{done++;upd();}));
 for(const k of SPRITE_IDS)tasks.push(loadImg(IMGS[k],true,12000).then(im=>{
  done++;upd();
  if(!im){SPRPROC[k]=null;return;}
  SPRPROC[k]=keyOut(im);
 }));
 await Promise.all(tasks);
}
$('pcImg').src=IMGS.bayon;
$('titleScreen').style.backgroundImage='url("'+IMGS.title+'"), radial-gradient(100% 80% at 50% 20%,#1b2436 0%,#080a12 100%)';
$('ldSkip').onclick=()=>boot();
setTimeout(()=>{$('ldSkip').style.display='inline-block';},5000);
setTimeout(boot,30000);
preloadAll().then(boot).catch(boot);
document.addEventListener('visibilitychange',()=>{if(ctx&&ctx.state==='running'&&!document.hidden)ctx.resume();});
